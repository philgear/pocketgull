name: "CI — Lint & Test"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Lint (tsc --noEmit)
        run: npm run lint

      - name: Run Tests (Vitest)
        run: npx vitest run

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          cd pocketgull_api
          pip install -r requirements.txt

      - name: Run Python Tests
        run: python3 pocketgull_api/run_tests.py
