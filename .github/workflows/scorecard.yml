name: "OSSF Scorecard"

on:
  push:
    branches: [ "main" ]
  schedule:
    # Run every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'

# Required permissions for Scorecard
permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Upload SARIF to Security tab
      id-token: write         # Publish results to OpenSSF
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Disable public REST publish if OIDC token is missing, keeping SARIF local upload robust
          publish_results: false

      - name: Upload Scorecard Results to Security Tab
        uses: github/codeql-action/upload-sarif@b56e499556dcd48007747c3e601eed992ad82c6d # v3.28.10
        with:
          sarif_file: results.sarif

      - name: Upload SARIF Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb458e05 # v4.6.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
