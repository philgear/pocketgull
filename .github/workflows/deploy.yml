name: CI/CD Pipeline (HIPAA Compliant)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Security Audit
        run: npm audit --json > audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb458e05 # v4.6.0
        with:
          name: npm-audit-report
          path: audit.json
        
      # Ensure code quality for clinical safety
      - name: Run Linters
        run: npm run lint --if-present

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt

      - name: Run Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r pocketgull_api/requirements.txt --local 

      # Run unit tests (safety red-team + service logic)
      - name: Run Unit Tests
        run: npx vitest run

  test-e2e:
    needs: security-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          GEMINI_API_KEY: ''
          SKIP_HEALTHCARE_PROVISION: 'true'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb458e05 # v4.6.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Deploy a tagged Cloud Run revision for PR preview/staging
  preview-deploy:
    needs: [security-and-lint, test-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@71f986410df66e1321f58500205579736cf6b728 # v2.1.8
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79db28562d5b6e22f28148b5 # v2.1.4

      - name: Build Preview Image
        run: |
          gcloud auth configure-docker gcr.io
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          docker build -t $IMAGE_PATH:pr-${{ github.event.number }} .

      - name: Push Preview Image
        run: |
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          docker push $IMAGE_PATH:pr-${{ github.event.number }}

      - name: Deploy Preview to Cloud Run
        id: deploy-preview
        uses: google-github-actions/deploy-cloudrun@f1c50e20f1cb601991d7945d8205562725e2e8be # v2.7.0
        with:
          service: 'pocket-gull-v2'
          region: 'us-central1'
          image: 'gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull:pr-${{ github.event.number }}'
          tag: 'pr-${{ github.event.number }}'
          no_traffic: true  # Don't shift production traffic
          env_vars: |
            NODE_ENV=production
            OTEL_SDK_DISABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_REGION=us-central1
          flags: '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest --concurrency=100 --max-instances=1 --min-instances=0'

      - name: Comment Preview URL on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const url = '${{ steps.deploy-preview.outputs.url }}';
            const body = `🔍 **Preview deployed!**\n\n🌐 ${url}\n\n_This preview will be cleaned up when the PR is closed._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Preview deployed!'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build-and-deploy:
    needs: [security-and-lint, test-e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production # Enables manual approval gates in GitHub
    
    # Required permissions for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'
      security-events: 'write' # For Trivy SARIF upload
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@71f986410df66e1321f58500205579736cf6b728 # v2.1.8
        with:
          # Keyless Workload Identity Federation
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79db28562d5b6e22f28148b5 # v2.1.4
          
      - name: Build Docker Image
        run: |
          gcloud auth configure-docker gcr.io
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          
          # Docker caching for faster builds
          docker pull $IMAGE_PATH:latest || true
          docker build \
            --cache-from $IMAGE_PATH:latest \
            -t $IMAGE_PATH:${{ github.sha }} \
            -t $IMAGE_PATH:latest .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf4004022a106e23297a7a371c6 # v0.29.0
        with:
          image-ref: 'gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          # Don't fail the build on existing vulns, but upload results
          exit-code: '0'

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@b56e499556dcd48007747c3e601eed992ad82c6d # v3.28.10
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

      - name: Push Docker Image
        run: |
          IMAGE_PATH=gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest
          
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@f1c50e20f1cb601991d7945d8205562725e2e8be # v2.7.0
        with:
          service: 'pocket-gull-v2'
          region: 'us-central1'
          image: 'gcr.io/${{ secrets.GCP_PROJECT_ID }}/pocket-gull:${{ github.sha }}'
          env_vars: |
            NODE_ENV=production
            OTEL_SDK_DISABLED=true
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_REGION=us-central1
          # Secure deployment flags + secrets binding
          flags: '--vpc-egress=private-ranges-only --concurrency=100 --max-instances=2 --min-instances=0 --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,AWS_HEALTHLAKE_ENDPOINT=AWS_HEALTHLAKE_ENDPOINT:latest'
