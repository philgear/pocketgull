name: "Fuzz Testing"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'pocketgull_api/**'
  schedule:
    # Run every Saturday at 4:00 AM UTC
    - cron: '0 4 * * 6'

permissions:
  contents: read

jobs:
  fuzz:
    name: Python Fuzz Tests (Atheris)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605c52c26077c128073c6e643ed2d7e008d1f2 # v2.10.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt
          pip install atheris

      - name: Run Fuzz Targets
        run: |
          cd pocketgull_api
          python fuzz_targets.py
        env:
          # Atheris CI mode: run each target for a fixed number of iterations
          FUZZING_CI: "true"
        timeout-minutes: 10
