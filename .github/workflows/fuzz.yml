name: "Fuzz Testing"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Saturday at 4:00 AM UTC
    - cron: '0 4 * * 6'

permissions:
  contents: read

jobs:
  fuzz:
    name: Python Fuzz Tests (Atheris)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libhdf5-dev
          python -m pip install --upgrade pip
          pip install -r pocketgull_api/requirements.txt
          pip install atheris

      - name: Run Fuzz Targets
        run: |
          cd pocketgull_api
          python fuzz_targets.py
        env:
          # Atheris CI mode: run each target for a fixed number of iterations
          FUZZING_CI: "true"
        timeout-minutes: 10
