name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc58e4585e5166641e4e4c7e7b28678e16 # v4.5.0
        with:
          # Block PRs that introduce high or critical severity vulnerabilities
          fail-on-severity: high
          # Use dedicated config file
          config-file: '.github/dependency-review-config.yml'
          # Comment on the PR with a summary of findings
          comment-summary-in-pr: always
          # Enable Scorecard checks to show metadata details
          show-openssf-scorecard: true
          # Lower warning threshold to 1.5 to clean up warnings on standard packages
          warn-on-openssf-scorecard-level: 1.5
