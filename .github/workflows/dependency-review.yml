name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block PRs that introduce high or critical severity vulnerabilities
          fail-on-severity: high
          # Use dedicated config file
          config-file: '.github/dependency-review-config.yml'
          # Comment on the PR with a summary of findings
          comment-summary-in-pr: always
          # Enable Scorecard checks to show metadata details
          show-openssf-scorecard: true
          # Lower warning threshold to 1.5 to clean up warnings on standard packages
          warn-on-openssf-scorecard-level: 1.5
