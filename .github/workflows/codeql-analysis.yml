name: "CodeQL Analysis"

permissions: read-all

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Thursday at 8:30 PM UTC
    - cron: '30 20 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'javascript-typescript'
            build-mode: 'none'
          - language: 'python'
            build-mode: 'none'

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@4d991eb7696c2e30e9314e0def43d804f3f22d9d # v2.11.0
      with:
        disable-sudo: true
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b56e499556dcd48007747c3e601eed992ad82c6d # v3.28.10
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b56e499556dcd48007747c3e601eed992ad82c6d # v3.28.10
      with:
        category: "/language:${{ matrix.language }}"
