name: "CodeQL Analysis"

permissions: read-all

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Thursday at 8:30 PM UTC
    - cron: '30 20 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'javascript-typescript'
          - language: 'python'

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2.10.4
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Python & Dependencies
      if: matrix.language == 'python'
      uses: actions/setup-python@42375567e7c4133481231a384564c74068305001 # v5.3.0
      with:
        python-version: '3.11'

    - name: Install Python Sidecar Dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r pocketgull_api/requirements.txt || true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
      with:
        languages: ${{ matrix.language }}
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
      with:
        category: "/language:${{ matrix.language }}"

